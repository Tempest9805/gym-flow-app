<body class="antialiased min-h-screen flex flex-col">
<!-- TopAppBar Shared Component -->
<header class="bg-[#121212] flex justify-between items-center h-16 px-6 w-full border-b border-white/10 sticky top-0 z-40">
<button class="hover:bg-white/5 transition-colors active:scale-95 duration-150 p-2 -ml-2 rounded-full flex items-center justify-center">

            </h1>
</section>

<!-- Background Image overlay for premium feel -->
<div class="absolute inset-0 opacity-40 bg-[url('https://images.unsplash.com/photo-1581009146145-b5ef050c2e1e?q=80&amp;w=1000&amp;auto=format&amp;fit=crop')] bg-cover bg-center mix-blend-overlay" data-alt="A highly atmospheric, dark and moody photograph of heavy iron gym plates stacked on a barbell in a professional fitness facility. The lighting is cinematic and high-contrast, featuring deep shadowy blacks and sharp, dramatic rim lighting that emphasizes the raw texture of the metal. Subtle neon orange ambient light spills from the background, perfectly aligning with the aggressive, premium Nocturnal/Neon UI aesthetic of a high-end training dashboard."></div>
<div class="relative p-6 flex flex-col space-y-6 z-10">
<div class="flex justify-between items-center">
<span class="font-label-caps text-label-caps text-primary-container">TODAY'S ROUTINE</span>
<span class="material-symbols-outlined text-primary-container" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
</div>
<div>
<h2 class="font-headline-md text-headline-md text-white mb-1">UPPER BODY POWER</h2>
<p class="font-body-base text-body-base text-zinc-400">45 Min • 6 Exercises</p>
</div>
<button class="w-full h-touch_target_min bg-primary-container text-black font-label-caps text-label-caps rounded flex justify-center items-center active:scale-95 transition-transform shadow-[0_0_15px_rgba(255,95,31,0.3)]">
                    START WORKOUT
                </button>
</div>
</section>

<span class="material-symbols-outlined text-3xl text-zinc-300" style="font-variation-settings: 'FILL' 1;">bolt</span>
<span class="font-display-lg text-4xl text-white tracking-tighter">4</span>
<span class="font-label-caps text-label-caps text-zinc-500">DAY STREAK</span>
</div>

<span class="material-symbols-outlined text-3xl text-zinc-300" style="font-variation-settings: 'FILL' 1;">trophy</span>
<span class="font-display-lg text-4xl text-white tracking-tighter">12</span>
<span class="font-label-caps text-label-caps text-zinc-500">NEW PRs</span>
</div>

</div>
</div>

</div>
<div>
<p class="font-title-sm text-title-sm text-white">Leg Day - Hypertrophy</p>

</div>
</div>
<span class="material-symbols-outlined text-zinc-600">chevron_right</span>
</div>
</div>
