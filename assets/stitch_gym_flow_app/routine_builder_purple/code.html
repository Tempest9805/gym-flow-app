<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Routine Builder - GYM FLOW</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700;800&amp;family=Inter:wght@400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "tertiary-container": "#a76900",
                        "primary": "#ebb2ff",
                        "surface-tint": "#ebb2ff",
                        "tertiary-fixed": "#ffddb8",
                        "on-secondary-fixed": "#23005c",
                        "on-tertiary-container": "#ffffff",
                        "secondary-container": "#571bc1",
                        "on-secondary-fixed-variant": "#5516be",
                        "primary-fixed-dim": "#ebb2ff",
                        "on-tertiary-fixed": "#2b1700",
                        "on-secondary": "#3c0091",
                        "surface-variant": "#3b313e",
                        "outline": "#9d8ba0",
                        "surface-container-lowest": "#130b16",
                        "on-primary-fixed": "#320047",
                        "on-tertiary": "#472a00",
                        "error": "#ffb4ab",
                        "on-error-container": "#ffdad6",
                        "tertiary": "#ffb960",
                        "on-tertiary-fixed-variant": "#653e00",
                        "on-primary": "#520072",
                        "surface-bright": "#403643",
                        "tertiary-fixed-dim": "#ffb960",
                        "secondary-fixed-dim": "#d0bcff",
                        "secondary-fixed": "#e9ddff",
                        "on-primary-fixed-variant": "#74009f",
                        "surface-dim": "#19101c",
                        "on-surface": "#eeddee",
                        "secondary": "#d0bcff",
                        "on-primary-container": "#ffffff",
                        "on-secondary-container": "#c4abff",
                        "inverse-surface": "#eeddee",
                        "inverse-on-surface": "#372d3a",
                        "inverse-primary": "#9800d0",
                        "background": "#19101c",
                        "surface-container-highest": "#3b313e",
                        "on-background": "#eeddee",
                        "surface-container-high": "#302733",
                        "surface-container": "#251c28",
                        "primary-container": "#bc13fe",
                        "primary-fixed": "#f8d8ff",
                        "error-container": "#93000a",
                        "surface-container-low": "#211824",
                        "outline-variant": "#504254",
                        "surface": "#19101c",
                        "on-surface-variant": "#d4c0d7",
                        "on-error": "#690005"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "unit": "8px",
                        "touch-target-min": "48px",
                        "card-gap": "12px",
                        "gutter": "16px",
                        "margin-mobile": "20px"
                    },
                    fontFamily: {
                        "label-caps": ["Inter"],
                        "headline-md": ["Lexend"],
                        "headline-lg": ["Lexend"],
                        "display-xl": ["Lexend"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"]
                    },
                    fontSize: {
                        "label-caps": ["12px", { lineHeight: "1", letterSpacing: "0.1em", fontWeight: "700" }],
                        "headline-md": ["24px", { lineHeight: "1.3", fontWeight: "600" }],
                        "headline-lg": ["32px", { lineHeight: "1.2", letterSpacing: "-0.01em", fontWeight: "700" }],
                        "display-xl": ["48px", { lineHeight: "1.1", letterSpacing: "-0.02em", fontWeight: "800" }],
                        "body-md": ["16px", { lineHeight: "1.5", fontWeight: "400" }],
                        "body-lg": ["18px", { lineHeight: "1.6", fontWeight: "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md min-h-screen overflow-x-hidden selection:bg-primary-container selection:text-black">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-zinc-950/90 backdrop-blur-xl border-b border-zinc-800 flex justify-between items-center px-5 h-16 w-full">
<button class="text-zinc-400 hover:text-fuchsia-400 transition-colors active:scale-95 duration-200 w-12 h-12 flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="text-fuchsia-500 font-lexend font-bold tracking-tighter uppercase font-headline-md">BUILD ROUTINE</h1>
<div class="w-12 h-12"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="pt-24 pb-32 px-margin-mobile max-w-2xl mx-auto space-y-8">
<!-- Routine Metadata -->
<section class="space-y-4">
<div class="space-y-2">
<label class="font-label-caps text-label-caps text-outline uppercase tracking-widest block">Routine Name</label>
<input class="w-full bg-[#1A1A1A] border-outline-variant rounded-lg text-on-surface font-body-lg h-touch-target-min px-4 focus:ring-1 focus:ring-primary-container focus:border-primary-container transition-colors placeholder-zinc-600" placeholder="e.g., Push/Pull/Legs" type="text"/>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="space-y-2">
<label class="font-label-caps text-label-caps text-outline uppercase tracking-widest block">Goal</label>
<div class="relative">
<select class="w-full bg-[#1A1A1A] border-outline-variant rounded-lg text-on-surface font-body-md h-touch-target-min pl-4 pr-10 appearance-none focus:ring-1 focus:ring-primary-container focus:border-primary-container transition-colors">
<option>Hypertrophy</option>
<option>Strength</option>
<option>Endurance</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
<div class="space-y-2">
<label class="font-label-caps text-label-caps text-outline uppercase tracking-widest block">Duration (Weeks)</label>
<input class="w-full bg-[#1A1A1A] border-outline-variant rounded-lg text-on-surface font-body-md h-touch-target-min px-4 focus:ring-1 focus:ring-primary-container focus:border-primary-container transition-colors text-center" type="number" value="8"/>
</div>
</div>
</section>
<!-- Days Builder (Bento Grid Style) -->
<section class="space-y-6">
<div class="flex justify-between items-center">
<h2 class="font-headline-md text-headline-md text-on-surface">Workout Split</h2>
<button class="bg-surface-variant text-on-surface-variant px-4 py-2 rounded-full font-label-caps text-label-caps hover:bg-surface-container-high transition-colors flex items-center gap-2">
<span class="material-symbols-outlined text-[16px]" data-icon="add">add</span> DAY
                </button>
</div>
<!-- Day 1 Card -->
<div class="bg-[#1A1A1A] border border-[#2A2A2A] rounded-xl p-5 space-y-5">
<div class="flex justify-between items-center border-b border-[#2A2A2A] pb-3">
<input class="bg-transparent border-none text-on-surface font-headline-md text-headline-md focus:ring-0 p-0 w-2/3" type="text" value="Day 1: Push"/>
<button class="text-outline hover:text-error transition-colors">
<span class="material-symbols-outlined" data-icon="delete">delete</span>
</button>
</div>
<!-- Exercise List -->
<div class="space-y-4">
<!-- Exercise Item -->
<div class="group bg-surface-container-low rounded-lg p-4 border border-transparent focus-within:border-primary-container/50 transition-colors">
<div class="flex justify-between items-start mb-3">
<div class="flex-1">
<input class="bg-transparent border-none text-on-surface font-body-lg font-bold p-0 focus:ring-0 w-full placeholder-zinc-600" type="text" value="Barbell Bench Press"/>
<span class="inline-block mt-1 px-2 py-0.5 bg-primary-container/15 text-primary-container rounded-full font-label-caps text-[10px]">CHEST</span>
</div>
<button class="text-zinc-600 hover:text-on-surface transition-colors">
<span class="material-symbols-outlined" data-icon="drag_indicator">drag_indicator</span>
</button>
</div>
<div class="grid grid-cols-3 gap-3">
<div class="bg-[#130b16] rounded flex flex-col items-center justify-center py-2 px-1 border border-surface-container">
<span class="font-label-caps text-[10px] text-outline mb-1">SETS</span>
<input class="bg-transparent border-none text-on-surface font-body-md text-center w-full p-0 h-6 focus:ring-0" type="number" value="4"/>
</div>
<div class="bg-[#130b16] rounded flex flex-col items-center justify-center py-2 px-1 border border-surface-container">
<span class="font-label-caps text-[10px] text-outline mb-1">REPS</span>
<input class="bg-transparent border-none text-on-surface font-body-md text-center w-full p-0 h-6 focus:ring-0" type="text" value="8-10"/>
</div>
<div class="bg-[#130b16] rounded flex flex-col items-center justify-center py-2 px-1 border border-surface-container">
<span class="font-label-caps text-[10px] text-outline mb-1">REST (s)</span>
<input class="bg-transparent border-none text-on-surface font-body-md text-center w-full p-0 h-6 focus:ring-0" type="number" value="90"/>
</div>
</div>
</div>
<!-- Exercise Item -->
<div class="group bg-surface-container-low rounded-lg p-4 border border-transparent focus-within:border-primary-container/50 transition-colors">
<div class="flex justify-between items-start mb-3">
<div class="flex-1">
<input class="bg-transparent border-none text-on-surface font-body-lg font-bold p-0 focus:ring-0 w-full placeholder-zinc-600" type="text" value="Overhead Press"/>
<span class="inline-block mt-1 px-2 py-0.5 bg-primary-container/15 text-primary-container rounded-full font-label-caps text-[10px]">SHOULDERS</span>
</div>
<button class="text-zinc-600 hover:text-on-surface transition-colors">
<span class="material-symbols-outlined" data-icon="drag_indicator">drag_indicator</span>
</button>
</div>
<div class="grid grid-cols-3 gap-3">
<div class="bg-[#130b16] rounded flex flex-col items-center justify-center py-2 px-1 border border-surface-container">
<span class="font-label-caps text-[10px] text-outline mb-1">SETS</span>
<input class="bg-transparent border-none text-on-surface font-body-md text-center w-full p-0 h-6 focus:ring-0" type="number" value="3"/>
</div>
<div class="bg-[#130b16] rounded flex flex-col items-center justify-center py-2 px-1 border border-surface-container">
<span class="font-label-caps text-[10px] text-outline mb-1">REPS</span>
<input class="bg-transparent border-none text-on-surface font-body-md text-center w-full p-0 h-6 focus:ring-0" type="text" value="10-12"/>
</div>
<div class="bg-[#130b16] rounded flex flex-col items-center justify-center py-2 px-1 border border-surface-container">
<span class="font-label-caps text-[10px] text-outline mb-1">REST (s)</span>
<input class="bg-transparent border-none text-on-surface font-body-md text-center w-full p-0 h-6 focus:ring-0" type="number" value="60"/>
</div>
</div>
</div>
</div>
<button class="w-full border border-dashed border-outline-variant text-outline-variant hover:border-primary-container hover:text-primary-container h-touch-target-min rounded-lg font-label-caps text-label-caps flex items-center justify-center gap-2 transition-colors">
<span class="material-symbols-outlined text-[18px]" data-icon="add_circle">add_circle</span> ADD EXERCISE
                </button>
</div>
<!-- Day 2 Card (Collapsed State representation) -->
<div class="bg-[#1A1A1A] border border-[#2A2A2A] rounded-xl p-5 flex justify-between items-center opacity-70 hover:opacity-100 transition-opacity cursor-pointer">
<h3 class="font-headline-md text-body-lg text-on-surface">Day 2: Pull</h3>
<div class="flex items-center gap-4 text-outline">
<span class="font-label-caps text-[10px]">5 EXERCISES</span>
<span class="material-symbols-outlined" data-icon="expand_more">expand_more</span>
</div>
</div>
</section>
</main>
<!-- Global FAB / Action Bar for Kiosk linearity -->
<div class="fixed bottom-0 left-0 w-full p-4 bg-gradient-to-t from-background via-background to-transparent pointer-events-none z-40 pb-safe">
<div class="max-w-md mx-auto pointer-events-auto shadow-[0_0_20px_rgba(188,19,254,0.1)]">
<button class="w-full bg-primary-container text-black font-headline-md text-body-lg h-[64px] rounded-xl flex items-center justify-center gap-3 active:scale-95 transition-transform shadow-[0_0_15px_rgba(188,19,254,0.3)]">
<span class="material-symbols-outlined" data-icon="save">save</span>
                SAVE ROUTINE
            </button>
</div>
</div>
</body></html>
