<style>

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-base selection:bg-primary-container selection:text-black">
<!-- TopAppBar (Mapped directly from JSON, suppressed navigation structure applied) -->
<header class="bg-[#121212] text-orange-600 font-lexend font-bold tracking-tighter fixed w-full top-0 border-b border-white/10 shadow-none flex justify-between items-center h-16 px-6 z-50">
<!-- Logo Area (Disabled menu interaction for login context) -->
<div class="flex items-center gap-4">
<span class="text-2xl font-black text-white">GYM FLOW</span>
</div>
<!-- Trailing Action -->
<button class="font-label-caps text-label-caps text-[#B45309] uppercase tracking-widest active:scale-95 duration-150 p-2">
            EN
        </button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col items-center justify-center p-container_padding pt-32 pb-section_margin w-full max-w-md mx-auto">
<!-- Header -->
<div class="w-full mb-section_margin text-center">
<h1 class="font-display-lg text-display-lg text-inverse-surface mb-2">SYSTEM ACCESS</h1>
<p class="font-body-base text-body-base text-outline">Enter credentials to initialize protocol.</p>
</div>
<!-- Login Form -->
<form class="w-full flex flex-col gap-section_margin">
<div class="flex flex-col gap-card_gutter">
<!-- Email Input -->
<div class="flex flex-col gap-base_unit">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase ml-1" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline" data-icon="person">person</span>
<input class="w-full bg-[#1E1E1E] text-on-surface font-body-base text-body-base pl-12 pr-4 py-3 min-h-touch_target_min rounded-DEFAULT border-b-2 border-transparent focus:border-primary-container focus:outline-none focus:ring-0 transition-colors" id="email" placeholder="athlete@gymflow.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-base_unit">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase ml-1" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline" data-icon="lock">lock</span>
<input class="w-full bg-[#1E1E1E] text-on-surface font-body-base text-body-base pl-12 pr-4 py-3 min-h-touch_target_min rounded-DEFAULT border-b-2 border-transparent focus:border-primary-container focus:outline-none focus:ring-0 transition-colors" id="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
</div>
<!-- Actions -->
<div class="flex flex-col gap-card_gutter mt-4">
<!-- Primary CTA -->
<button class="w-full bg-primary-container text-[#000000] font-label-caps text-label-caps min-h-touch_target_min rounded-DEFAULT flex items-center justify-center uppercase tracking-widest hover:bg-primary active:scale-[0.98] transition-all" type="submit">
                    LOG IN
                </button>
<!-- Secondary Action -->
<button class="w-full bg-transparent border-2 border-primary-container text-primary-container font-label-caps text-label-caps min-h-touch_target_min rounded-DEFAULT flex items-center justify-center uppercase tracking-widest hover:bg-primary-container/10 active:scale-[0.98] transition-all" type="button">
                    Sign Up
                </button>
</div>
</form>
<!-- Tertiary Action -->
<div class="mt-section_margin text-center w-full">
<a class="font-body-base text-body-base text-outline hover:text-primary-container transition-colors p-2 inline-block min-h-[44px]" href="#">
                Forgot Password?
            </a>
</div>
