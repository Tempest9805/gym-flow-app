<body class="bg-background text-on-surface min-h-screen flex flex-col font-body-md overflow-x-hidden relative">
<!-- Ambient Background Graphic -->
<div class="fixed inset-0 z-[-1] opacity-30 mix-blend-screen bg-cover bg-center pointer-events-none" data-alt="A dark, moody abstract background featuring out-of-focus neon purple geometric shapes and light streaks. The aesthetic is vaporwave-inspired minimalism, designed to look like a high-end fitness tracking interface background. The lighting is low-key with vibrant, electric purple luminescence bleeding through deep blacks, creating a sense of intense athletic focus and digital sophistication." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBwQ3yiKP86w69PEvcfLuZpnQcqYRdyq59Fkzl9xgu7Pg03LrdwopZdzX5iHA37GqJZy80ylgPKNIZ1lsi2BbE3ObZ8MeDxYlKK13qk-6atcWalu5TCxjSXmgfHsz6WBpVfodQpAYpoZOhfUCva0AgyxMZlmyJ2ls7gfDxtWraz-8OB0pyf7fbW0KGMx9RFusu8mUH1B88gaRADMPQ86VOiYSMQAzLdDdhJZgHRo5WMxnQm_FEF59BAoRKA6ZFGQNEDX4mqlF67k9A');">
</div>
<div class="fixed inset-0 z-[-1] bg-gradient-to-t from-background via-background/80 to-transparent pointer-events-none"></div>
<!-- TopAppBar (from JSON) -->
<header class="bg-[#0A0A0A] dark:bg-[#0A0A0A] border-[#2A2A2A] flat no-shadows flex justify-between items-center h-16 px-6 w-full sticky top-0 z-50 border-b">
<button class="text-[#BC13FE] hover:bg-[#1A1A1A] transition-colors active:scale-95 duration-200 p-2 -ml-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="text-xl font-black text-[#BC13FE] drop-shadow-[0_0_8px_rgba(188,19,254,0.4)] font-['Lexend'] tracking-tighter uppercase text-center flex-1">
            ELITE PERFORMANCE
        </h1>
<button class="text-[#BC13FE] font-['Lexend'] font-bold tracking-tighter uppercase text-sm hover:bg-[#1A1A1A] transition-colors active:scale-95 duration-200 px-3 py-1 rounded">
            EN/ES
        </button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col justify-center items-center px-margin-mobile py-12 w-full z-10">
<div class="w-full max-w-md flex flex-col gap-8">
<!-- Hero Text -->
<div class="text-center mb-4">
<h2 class="font-display-xl text-display-xl text-on-surface mb-2">SYSTEM<br/>ACCESS</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">Identify yourself to continue.</p>
</div>
<!-- Form Container -->
<form class="flex flex-col gap-6" onsubmit="event.preventDefault();">
<!-- Email Input -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest pl-1" for="email">Email Designation</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant pointer-events-none" data-icon="person">person</span>
<input class="w-full h-[64px] bg-surface-container border border-surface-variant rounded-lg pl-12 pr-4 font-body-lg text-body-lg text-on-surface focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-all placeholder:text-outline-variant/50" id="email" placeholder="ATHLETE@GYMFLOW.COM" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center pl-1">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest" for="password">Security Code</label>
<a class="font-label-caps text-label-caps text-primary-container hover:text-primary transition-colors tracking-widest" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant pointer-events-none" data-icon="lock">lock</span>
<input class="w-full h-[64px] bg-surface-container border border-surface-variant rounded-lg pl-12 pr-4 font-body-lg text-body-lg text-on-surface focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-all placeholder:text-outline-variant/50 tracking-[0.2em]" id="password" placeholder="••••••••••••" type="password"/>
</div>
</div>
<!-- Primary Action -->
<button class="mt-4 h-[64px] w-full bg-primary-container text-[#0A0A0A] font-headline-md text-headline-md rounded-lg shadow-[0_0_12px_rgba(188,19,254,0.3)] hover:shadow-[0_0_24px_rgba(188,19,254,0.6)] hover:bg-primary transition-all flex items-center justify-center tracking-wider active:scale-[0.98] duration-200 uppercase" type="submit">
                    LOG IN
                </button>
</form>
<!-- Secondary Path -->
<div class="mt-2 text-center">
<a class="inline-flex items-center justify-center h-touch-target-min px-6 font-body-md text-body-md text-on-surface border border-surface-variant rounded-lg hover:bg-surface-variant/50 transition-colors w-full" href="#">
                    Sign Up
                </a>
</div>
<!-- Structural Divider -->
<!-- Tertiary Actions -->
</div>
</main>
