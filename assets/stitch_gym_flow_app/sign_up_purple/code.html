<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>

<title>Gym Flow - Sign Up</title>

        theme: {

                    "secondary-fixed": "#e9ddff",

                    "on-background": "#eeddee",
                    "surface-container-high": "#302733",
                    "surface-container": "#251c28",
                    "primary-container": "#bc13fe",
                    "primary-fixed": "#f8d8ff",
                    "error-container": "#93000a",
                    "surface-container-low": "#211824",
                    "outline-variant": "#504254",
                    "surface": "#19101c",
                    "on-surface-variant": "#d4c0d7",
                    "on-error": "#690005"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "unit": "8px",
                    "touch-target-min": "48px",
                    "card-gap": "12px",
                    "gutter": "16px",
                    "margin-mobile": "20px"
            },
            "fontFamily": {
                    "label-caps": [
                            "Inter"
                    ],
                    "headline-md": [
                            "Lexend"

                    "display-xl": [

<style>
    body {
      min-height: max(884px, 100dvh);
    }

  </head>
<body class="bg-background text-on-background min-h-screen relative overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container flex flex-col items-center justify-center p-margin-mobile">
<!-- Vaporwave Ambient Glow -->
<div class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[120vw] max-w-4xl h-[1060px] max-h-4xl bg-primary-container/10 blur-[150px] -z-10 rounded-full pointer-events-none"></div>
<main class="w-full max-w-md flex flex-col items-center z-10 w-full">
<!-- Brand Header (Kiosk Minimalist Style) -->
<div class="flex flex-col items-center mb-10 gap-2">
<div class="w-16 h-16 rounded-2xl bg-surface-container-highest flex items-center justify-center border border-outline-variant shadow-[0_0_20px_rgba(188,19,254,0.15)] relative">
<!-- Inner glow ring -->
<div class="absolute inset-0 rounded-2xl border border-primary-container/30 blur-[2px]"></div>
<span class="material-symbols-outlined text-primary-container text-4xl z-10">fitness_center</span>
</div>
<h1 class="font-display-xl text-display-xl text-primary-container tracking-tighter uppercase mt-4 text-center drop-shadow-[0_0_10px_rgba(188,19,254,0.2)]">GYM FLOW</h1>
</div>
<!-- Form Card Surface -->
<div class="w-full bg-surface/80 backdrop-blur-xl rounded-xl p-8 border border-outline-variant shadow-2xl relative overflow-hidden">
<!-- Subtle top highlight for glass effect -->
<div class="absolute top-0 left-0 right-0 h-px bg-gradient-to-r from-transparent via-primary-container/30 to-transparent"></div>
<h2 class="font-headline-md text-headline-md text-on-surface text-center mb-8 uppercase tracking-wide">Create Account</h2>
<form class="flex flex-col gap-6 w-full">
<!-- Full Name Field -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase pl-1" for="fullName">Full Name</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-outline z-10 pointer-events-none">person</span>
<input class="w-full h-touch-target-min sm:h-[56px] bg-surface-container-low rounded-lg pl-12 pr-4 font-body-lg text-body-lg text-on-surface placeholder:text-outline-variant border border-outline-variant focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all outline-none" id="fullName" placeholder="John Doe" required="" type="text"/>
</div>
</div>
<!-- Email Field -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase pl-1" for="email">Email</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-outline z-10 pointer-events-none">mail</span>
<input class="w-full h-touch-target-min sm:h-[56px] bg-surface-container-low rounded-lg pl-12 pr-4 font-body-lg text-body-lg text-on-surface placeholder:text-outline-variant border border-outline-variant focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all outline-none" id="email" placeholder="athlete@gymflow.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase pl-1" for="password">Password</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-outline z-10 pointer-events-none">lock</span>
<input class="w-full h-touch-target-min sm:h-[56px] bg-surface-container-low rounded-lg pl-12 pr-4 font-body-lg text-body-lg text-on-surface placeholder:text-outline-variant border border-outline-variant focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all outline-none" id="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Primary CTA Button -->
<button class="mt-4 w-full h-[64px] bg-primary-container text-surface-container-lowest rounded-lg font-label-caps text-label-caps uppercase tracking-widest flex items-center justify-center gap-3 shadow-[0_0_15px_rgba(188,19,254,0.3)] hover:shadow-[0_0_25px_rgba(188,19,254,0.5)] hover:bg-primary transition-all duration-200 active:scale-[0.98]" type="submit">
                    Sign Up
                    <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
</div>
<!-- Footer Link -->
<div class="mt-8 font-body-md text-body-md text-on-surface-variant text-center">
            Already have an account? 
            <a class="text-primary-container hover:text-primary font-semibold transition-colors uppercase tracking-wide ml-1 text-sm" href="#">Login</a>
</div>
</main>
</body></html>
